<svg width="60" height="36" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cL"><rect x="12" y="4" width="6" height="28"/></clipPath>
    <clipPath id="cM"><rect x="12" y="17" width="36" height="6"/></clipPath>
    <clipPath id="cR"><rect x="42" y="4" width="6" height="28"/></clipPath>
  </defs>
  <style>
    @keyframes swpLR { 0%{transform:translateX(-18px)} 50%,100%{transform:translateX(18px)} }
    @keyframes swpM  { 0%{transform:translateX(-27px)} 50%,100%{transform:translateX(27px)} }
    .sL{animation:swpLR 1.5s ease-in-out 0s   infinite}
    .sM{animation:swpM  1.5s ease-in-out 0.2s infinite}
    .sR{animation:swpLR 1.5s ease-in-out 0.4s infinite}
  </style>
  <g transform="translate(30,18) skewX(-12) translate(-30,-18)">
    <rect x="12" y="4" width="6" height="28" fill="#004F98"/>
    <g clip-path="url(#cL)"><rect class="sL" x="6"  y="4" width="18" height="28" fill="url(#sheen)"/></g>
    <rect x="12" y="17" width="36" height="6" fill="#004F98"/>
    <g clip-path="url(#cM)"><rect class="sM" x="21" y="17" width="18" height="6" fill="url(#sheen)"/></g>
    <rect x="42" y="4" width="6" height="28" fill="#004F98"/>
    <g clip-path="url(#cR)"><rect class="sR" x="36" y="4" width="18" height="28" fill="url(#sheen)"/></g>
  </g>
</svg>