<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cL"><rect x="4" y="5" width="3" height="14"/></clipPath>
    <clipPath id="cM"><rect x="4" y="11" width="16" height="3"/></clipPath>
    <clipPath id="cR"><rect x="17" y="5" width="3" height="14"/></clipPath>
  </defs>
  <style>
    @keyframes swpLR { 0%{transform:translateX(-9px)} 50%,100%{transform:translateX(9px)} }
    @keyframes swpM  { 0%{transform:translateX(-13px)} 50%,100%{transform:translateX(13px)} }
    .sL{animation:swpLR 1.5s ease-in-out 0s   infinite}
    .sM{animation:swpM  1.5s ease-in-out 0.2s infinite}
    .sR{animation:swpLR 1.5s ease-in-out 0.4s infinite}
  </style>
  <g transform="translate(12,12) skewX(-12) translate(-12,-12)">
    <rect x="4" y="5" width="3" height="14" fill="#004F98"/>
    <g clip-path="url(#cL)"><rect class="sL" x="1"  y="5" width="9" height="14" fill="url(#sheen)"/></g>
    <rect x="4" y="11" width="16" height="3" fill="#004F98"/>
    <g clip-path="url(#cM)"><rect class="sM" x="8"  y="11" width="9" height="3" fill="url(#sheen)"/></g>
    <rect x="17" y="5" width="3" height="14" fill="#004F98"/>
    <g clip-path="url(#cR)"><rect class="sR" x="14" y="5" width="9" height="14" fill="url(#sheen)"/></g>
  </g>
</svg>