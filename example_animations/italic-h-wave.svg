<svg width="72" height="44" viewBox="0 0 72 44" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track { fill: #808495; opacity: 0.2; }
    .fill  { fill: #808495; transform-origin: bottom; animation: rise 1.8s ease-in-out infinite; }
    .fl    { animation-delay: 0s; }
    .fm    { animation-delay: 0.3s; }
    .fr    { animation-delay: 0.6s; }
    @keyframes rise {
      0%   { transform: scaleY(0.05); opacity: 0.35; }
      50%  { transform: scaleY(1);    opacity: 1; }
      100% { transform: scaleY(0.05); opacity: 0.35; }
    }
  </style>
  <!-- ghost outlines -->
  <polygon class="track" points="18,0 30,0 21,42 9,42"/>
  <polygon class="track" points="26,17 52,17 51,27 25,27"/>
  <polygon class="track" points="60,0 72,0 63,42 51,42"/>
  <!-- animated fills (scale from bottom) -->
  <polygon class="fill fl" points="18,0 30,0 21,42 9,42"/>
  <polygon class="fill fm" points="26,17 52,17 51,27 25,27"/>
  <polygon class="fill fr" points="60,0 72,0 63,42 51,42"/>
</svg>
