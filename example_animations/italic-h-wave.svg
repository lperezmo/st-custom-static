<svg width="60" height="36" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fillUp{0%,100%{height:0px;y:32px}50%{height:28px;y:4px}}
    @keyframes fillRt{0%,100%{width:0px}50%{width:36px}}
    .fL{animation:fillUp 1.4s ease-in-out 0s   infinite}
    .fM{animation:fillRt 1.4s ease-in-out 0.3s infinite}
    .fR{animation:fillUp 1.4s ease-in-out 0.6s infinite}
  </style>
  <g transform="translate(30,18) skewX(-12) translate(-30,-18)">
    <rect x="12" y="4" width="6" height="28" fill="#004F98" opacity="0.25"/>
    <rect x="12" y="17" width="36" height="6" fill="#004F98" opacity="0.25"/>
    <rect x="42" y="4" width="6" height="28" fill="#004F98" opacity="0.25"/>
    <rect class="fL" x="12" y="32" width="6" height="0" fill="#004F98"/>
    <rect class="fM" x="12" y="17"      width="0"    height="6" fill="#004F98"/>
    <rect class="fR" x="42" y="32"  width="6" height="0" fill="#004F98"/>
  </g>
</svg>