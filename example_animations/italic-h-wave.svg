<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fillUp{0%,100%{height:0px;y:19px}50%{height:14px;y:5px}}
    @keyframes fillRt{0%,100%{width:0px}50%{width:16px}}
    .fL{animation:fillUp 1.4s ease-in-out 0s   infinite}
    .fM{animation:fillRt 1.4s ease-in-out 0.3s infinite}
    .fR{animation:fillUp 1.4s ease-in-out 0.6s infinite}
  </style>
  <g transform="translate(12,12) skewX(-12) translate(-12,-12)">
    <rect x="4" y="5" width="3" height="14" fill="#004F98" opacity="0.25"/>
    <rect x="4" y="11" width="16" height="3" fill="#004F98" opacity="0.25"/>
    <rect x="17" y="5" width="3" height="14" fill="#004F98" opacity="0.25"/>
    <rect class="fL" x="4" y="19" width="3" height="0" fill="#004F98"/>
    <rect class="fM" x="4" y="11"      width="0"    height="3" fill="#004F98"/>
    <rect class="fR" x="17" y="19"  width="3" height="0" fill="#004F98"/>
  </g>
</svg>