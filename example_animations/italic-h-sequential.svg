<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes seqFade{0%,25%,100%{opacity:.2}12.5%{opacity:1}}
    .bL{animation:seqFade 1.8s ease-in-out 0s   infinite}
    .bM{animation:seqFade 1.8s ease-in-out 0.3s infinite}
    .bR{animation:seqFade 1.8s ease-in-out 0.6s infinite}
  </style>
  <g transform="translate(12,12) skewX(-12) translate(-12,-12)">
    <rect class="bL" x="4" y="5" width="3" height="14" fill="#004F98"/>
    <rect class="bM" x="4" y="11" width="16" height="3" fill="#004F98"/>
    <rect class="bR" x="17" y="5" width="3" height="14" fill="#004F98"/>
  </g>
</svg>