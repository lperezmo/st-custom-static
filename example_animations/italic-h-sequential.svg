<svg width="60" height="36" viewBox="0 0 60 36" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes seqFade{0%,25%,100%{opacity:.2}12.5%{opacity:1}}
    .bL{animation:seqFade 1.8s ease-in-out 0s   infinite}
    .bM{animation:seqFade 1.8s ease-in-out 0.3s infinite}
    .bR{animation:seqFade 1.8s ease-in-out 0.6s infinite}
  </style>
  <g transform="translate(30,18) skewX(-12) translate(-30,-18)">
    <rect class="bL" x="12" y="4" width="6" height="28" fill="#004F98"/>
    <rect class="bM" x="12" y="17" width="36" height="6" fill="#004F98"/>
    <rect class="bR" x="42" y="4" width="6" height="28" fill="#004F98"/>
  </g>
</svg>