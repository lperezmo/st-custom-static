[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-custom-static"
version = "1.0.0"
description = "Custom loading animations for Streamlit - replaces the default spinner with polished alternatives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luis Perez", email = "lperezmo05@gmail.com" }]
keywords = ["streamlit", "animation", "spinner", "loading", "custom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lperezmo/st-custom-static"
Repository = "https://github.com/lperezmo/st-custom-static"
"Bug Tracker" = "https://github.com/lperezmo/st-custom-static/issues"

[project.scripts]
st-install = "st_custom_static.install:main"

[tool.hatch.build.targets.wheel]
packages = ["st_custom_static"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
allow_zero_version = false
allowed_tags = ["feat", "fix", "perf", "refactor", "style", "docs", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.ruff]
extend-exclude = ["manual-build/"]
