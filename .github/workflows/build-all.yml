name: Build All Icons x All Versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - icons/**
      - .github/workflows/build-all.yml

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.icon }} / ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        icon:
          - italic-h-sweep
          - italic-h-striped
          - italic-h-wave
          - italic-h-scan
          - italic-h-sequential
          - italic-h-cascade
          - three-dots
          - bar-chart
          - progress-ring
          - spinning-sync
          - pulsing-dot
          - rotating-gear
          - hourglass
        version:
          - "1.45.1"
          - "1.46.1"
          - "1.47.1"
          - "1.48.1"
          - "1.49.1"
          - "1.50.0"
          - "1.51.0"
          - "1.52.0"
          - "1.53.1"
          - "1.54.0"
          - "1.55.0"
          - "1.56.0"
          - "1.57.0"

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y protobuf-compiler rsync

      - name: Clone Streamlit ${{ matrix.version }}
        run: |
          git clone --depth 1 \
            --branch ${{ matrix.version }} \
            https://github.com/streamlit/streamlit.git \
            streamlit-src

      - name: Apply icon
        run: |
          SRC="icons/${{ matrix.icon }}.tsx"
          DST="streamlit-src/frontend/app/src/components/StatusWidget/IconRunning.tsx"
          [ -f "$SRC" ] || { echo "Icon not found: $SRC"; exit 1; }
          cp "$SRC" "$DST"

      - name: Enable corepack
        working-directory: streamlit-src/frontend
        run: |
          corepack enable
          corepack install

      - name: Install frontend deps
        working-directory: streamlit-src/frontend
        run: yarn install --immutable

      - name: Build frontend
        working-directory: streamlit-src/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn workspaces foreach --all --topological run build

      - name: Package static files
        id: package
        run: |
          ICON="${{ matrix.icon }}"
          VERSION="${{ matrix.version }}"
          ZIPNAME="streamlit-${VERSION}-${ICON}.zip"

          mkdir -p dist/static
          rsync -av --delete --delete-excluded --exclude=reports \
            streamlit-src/frontend/app/build/ dist/static/

          if [ -f dist/static/.vite/manifest.json ]; then
            mv dist/static/.vite/manifest.json dist/static/manifest.json
            rm -rf dist/static/.vite
          fi

          cd dist && zip -r "../${ZIPNAME}" static/
          echo "zipname=${ZIPNAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ICON="${{ matrix.icon }}"
          VERSION="${{ matrix.version }}"
          TAG="v${VERSION}-${ICON}"
          ZIPNAME="${{ steps.package.outputs.zipname }}"

          NOTES="Custom static files for Streamlit \`${VERSION}\` with the \`${ICON}\` loading animation.

          ## Quick install

          \`\`\`bash
          st-install --icon ${ICON} --version ${VERSION}
          \`\`\`

          Built from commit: \`${{ github.sha }}\`"

          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" &>/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" "${ZIPNAME}" --clobber
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "Streamlit ${VERSION} - ${ICON}" \
              --notes "$NOTES" \
              --prerelease \
              "${ZIPNAME}" \
            || gh release upload "$TAG" --repo "$REPO" "${ZIPNAME}" --clobber
          fi
