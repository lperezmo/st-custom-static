name: Watch Streamlit Releases

# Weekly check for a new STABLE Streamlit release. When the latest stable
# version is missing the custom-static release of any icon, build all icons
# for it via the reusable build-matrix workflow. Manual runs accept an
# override version and can force a rebuild even if releases already exist.

on:
  schedule:
    # 13:20 UTC every Monday (Streamlit ships roughly monthly)
    - cron: '20 13 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Override version to build (blank = latest stable Streamlit)
        required: false
        type: string
      force:
        description: Build even if releases for this version already exist
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
      icons: ${{ steps.decide.outputs.icons }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
          # Single source for the icon list: the build matrix below uses it too.
          ICONS: >-
            italic-h-sweep
            italic-h-striped
            italic-h-wave
            italic-h-scan
            italic-h-sequential
            italic-h-cascade
            three-dots
            bar-chart
            progress-ring
            spinning-sync
            pulsing-dot
            rotating-gear
            hourglass
        run: |
          set -euo pipefail

          if [ -n "${OVERRIDE:-}" ]; then
            VERSION="$OVERRIDE"
          else
            # /releases/latest excludes prereleases and drafts -> stable only.
            VERSION=$(gh api repos/streamlit/streamlit/releases/latest --jq .tag_name)
          fi
          echo "Latest stable Streamlit version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "icons=$(jq -cn --arg s "$ICONS" '$s | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Force enabled -> building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Look up each expected release by tag. No pipe (a `gh ... | grep -q`
          # pipeline fails under pipefail when grep exits early and gh gets
          # SIGPIPE) and no list limit. Build if ANY icon's release is missing,
          # so a partially completed earlier run gets finished.
          MISSING=""
          for ICON in $ICONS; do
            if ! gh release view "v${VERSION}-${ICON}" --repo "$REPO" >/dev/null 2>&1; then
              MISSING="$MISSING $ICON"
            fi
          done

          if [ -z "$MISSING" ]; then
            echo "All releases for v${VERSION}-* already exist -> skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Missing releases for v${VERSION}:${MISSING} -> building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        icon: ${{ fromJson(needs.check.outputs.icons) }}
    uses: ./.github/workflows/build-matrix.yml
    with:
      icon: ${{ matrix.icon }}
      versions: ${{ needs.check.outputs.version }}
    secrets: inherit
