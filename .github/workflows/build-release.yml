name: Build Streamlit Custom Static

# Manual entry point: pick one icon and a set of versions, then hand off to
# the reusable build-matrix workflow that does the actual build + release.

on:
  workflow_dispatch:
    inputs:
      icon:
        description: Icon animation to build
        required: true
        default: italic-h-sweep
        type: choice
        options:
          - italic-h-sweep
          - italic-h-striped
          - italic-h-wave
          - italic-h-scan
          - italic-h-sequential
          - italic-h-cascade
          - three-dots
          - bar-chart
          - progress-ring
          - spinning-sync
          - pulsing-dot
          - rotating-gear
          - hourglass
      versions:
        description: >
          Streamlit versions, comma-separated.
          Broad set: 1.45.1,1.46.1,1.47.1,1.48.1,1.49.1,1.50.0,1.51.0,1.52.0,1.53.1,1.54.0,1.55.0,1.56.0,1.57.0,1.58.0
        required: false
        default: 1.55.0,1.56.0,1.57.0,1.58.0

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-matrix.yml
    with:
      icon: ${{ inputs.icon }}
      versions: ${{ inputs.versions }}
    secrets: inherit
